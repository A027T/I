<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walking Dead</title>
    <style>
        :root {
            --bg-color: #050505;
            --glass-bg: rgba(18, 18, 18, 0.55);
            --glass-border: rgba(255, 0, 0, 0.18);
            --accent-red: #ff1a1a;
            --accent-red-hover: #e60000;
            --link-blue: #38bdf8;
            --text-main: #f5f5f7;
            --text-secondary: #8e8e93;
        }

        * { box-sizing: border-box; }

        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: var(--bg-color); 
            color: var(--text-main); 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Liquid Light */
        .liquid-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
            background: #050505;
        }

        .light-blob {
            position: absolute;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(220, 20, 20, 0.35) 0%, rgba(120, 0, 0, 0.1) 50%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: moveLight 12s ease-in-out infinite alternate;
        }

        .light-blob:nth-child(2) {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(180, 0, 0, 0.25) 0%, rgba(50, 0, 0, 0.05) 60%, transparent 80%);
            animation: moveLight2 15s ease-in-out infinite alternate;
            right: -50px;
            bottom: -50px;
        }

        @keyframes moveLight {
            0% { transform: translate(-30px, -30px) scale(1); }
            50% { transform: translate(150px, 200px) scale(1.2); }
            100% { transform: translate(50px, 100px) scale(0.9); }
        }

        @keyframes moveLight2 {
            0% { transform: translate(40px, 40px) scale(1); }
            50% { transform: translate(-180px, -150px) scale(1.3); }
            100% { transform: translate(-80px, -50px) scale(1); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 4px;
        }

        h2 { 
            font-size: 24px; 
            margin: 0; 
            color: var(--text-main);
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 2px 15px rgba(255, 0, 0, 0.4);
        }

        /* Liquid Glass Card */
        .card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 24px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                        inset 0 1px 1px rgba(255, 255, 255, 0.12);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            gap: 16px;
            text-align: center;
        }

        /* Large & Readable Episode Badge in Center */
        .episode-badge {
            align-self: center;
            background: rgba(255, 26, 26, 0.15);
            color: var(--accent-red);
            padding: 10px 22px;
            border-radius: 30px;
            font-size: 17px;
            font-weight: 700;
            border: 1px solid rgba(255, 26, 26, 0.3);
            box-shadow: 0 4px 15px rgba(255, 0, 0, 0.15);
            letter-spacing: 0.5px;
        }

        .label-title {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: -8px;
            font-weight: 500;
            text-align: right;
        }

        /* Blue Link Box */
        .value-box {
            font-size: 14px;
            font-weight: 500;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.45);
            padding: 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: var(--link-blue);
            line-height: 1.5;
            text-align: left;
            direction: ltr;
        }

        /* Controls under link */
        .controls { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 10px; 
            margin-top: 4px;
        }

        .btn-full {
            grid-column: span 2;
        }

        button { 
            font-size: 14px; 
            padding: 14px; 
            cursor: pointer; 
            background: rgba(25, 25, 25, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--text-main); 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            border-radius: 14px; 
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        button:active { 
            transform: scale(0.97);
            background: rgba(40, 40, 40, 0.9);
        }

        .btn-download {
            background: linear-gradient(135deg, var(--accent-red), #b30000);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 6px 20px rgba(255, 0, 0, 0.3);
            font-size: 15px;
            letter-spacing: 0.5px;
        }

        .btn-download:active {
            background: var(--accent-red-hover);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: var(--text-main);
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            border: 1px solid rgba(255, 26, 26, 0.3);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="liquid-bg">
        <div class="light-blob"></div>
        <div class="light-blob"></div>
    </div>

    <div class="container">
        <header>
            <h2>Walking Dead</h2>
        </header>
        
        <div class="card">
            <div id="info" class="episode-badge">فصل ۰۱ | قسمت ۰۱</div>
            
            <div class="label-title">لینک مستقیم:</div>
            <div id="link" class="value-box">...</div>

            <div class="controls">
                <button class="btn-full btn-download" onclick="manualDownload()">Download</button>
                <button onclick="change(1, 0)">قسمت بعد</button>
                <button onclick="change(-1, 0)">قسمت قبل</button>
                <button onclick="change(0, -1)">فصل قبل</button>
                <button onclick="change(0, 1)">فصل بعد</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">✓ لینک در کلیپ‌بورد کپی شد</div>

    <script>
        let season = 1;
        let episode = 1;
        let currentUrl = "";

        function update() {
            let s_str = String(season).padStart(2, '0');
            let e_str = String(episode).padStart(2, '0');
            
            currentUrl = `https://s1.irdanlod.ir/files/Series/T/TWD/S${s_str}/The.Walking.Dead.S${s_str}E${e_str}.480p.Farsi.Dubbed.mkv`;
            
            document.getElementById('info').innerText = `فصل ${s_str} | قسمت ${e_str}`;
            document.getElementById('link').innerText = currentUrl;
            
            navigator.clipboard.writeText(currentUrl).then(() => {
                showToast();
            }).catch(err => {
                console.error('Clipboard error', err);
            });
        }

        function manualDownload() {
            if (!currentUrl) return;
            let a = document.createElement('a');
            a.href = currentUrl;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function change(ep_delta, se_delta) {
            episode += ep_delta;
            season += se_delta;
            
            if (season < 1) season = 1;
            if (episode < 1) {
                if (season > 1) {
                    season--;
                    episode = 1;
                } else {
                    episode = 1;
                }
            }
            update();
        }

        function showToast() {
            let t = document.getElementById('toast');
            t.classList.add('show');
            setTimeout(() => {
                t.classList.remove('show');
            }, 1500);
        }

        update();
    </script>
</body>
</html>
