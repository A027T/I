<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سازنده و دانلودکننده لینک سریال</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: Tahoma, sans-serif; 
            margin: 0; 
            padding: 15px; 
            background: #121212; 
            color: #fff; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        h2 { text-align: center; font-size: 20px; margin-bottom: 15px; }
        .box { 
            background: #1e1e1e; 
            padding: 15px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            word-break: break-all;
            border: 1px solid #333;
        }
        .box h3 { margin-top: 0; color: #4dabf7; font-size: 18px; }
        .box p { margin-bottom: 0; font-size: 14px; color: #ccc; line-height: 1.5; }
        .buttons { 
            display: flex; 
            flex-direction: column; 
            gap: 10px; 
            margin-top: auto;
        }
        button { 
            font-size: 16px; 
            padding: 14px; 
            cursor: pointer; 
            background: #1f6feb; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            width: 100%;
            font-weight: bold;
        }
        button:active { background: #1158c7; }
        .btn-download { background: #2b8a3e; }
        .btn-download:active { background: #236c31; }
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #2b8a3e;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>

    <h2>سازنده و دانلودکننده TWD</h2>
    
    <div class="box">
        <h3 id="info">فصل 01 | قسمت 01</h3>
        <p id="filename">نام فایل: TWD.1.1.mkv</p>
        <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
        <p id="link">لینک...</p>
    </div>

    <div class="buttons">
        <button class="btn-download" onclick="triggerDownload()">📥 دانلود دستی این قسمت</button>
        <button onclick="change(1, 0)">۱ = قسمت بعد (+)</button>
        <button onclick="change(-1, 0)">۲ = قسمت قبل (-)</button>
        <button onclick="change(0, -1)">۳ = فصل قبل (-)</button>
        <button onclick="change(0, 1)">۴ = فصل بعد (+)</button>
    </div>

    <div id="toast" class="toast">✓ لینک کپی و دانلود آغاز شد</div>

    <script>
        let season = 1;
        let episode = 1;
        let currentUrl = "";

        function update() {
            let s_str = String(season).padStart(2, '0');
            let e_str = String(episode).padStart(2, '0');
            
            currentUrl = `https://example.com/files/Series/T/TWD/S${s_str}/The.Walking.Dead.S${s_str}E${e_str}.480p.Farsi.Dubbed.mkv`;
            let fname = `TWD.${season}.${episode}.mkv`;
            
            document.getElementById('info').innerText = `فصل ${s_str} | قسمت ${e_str}`;
            document.getElementById('filename').innerText = `نام فایل: ${fname}`;
            document.getElementById('link').innerText = currentUrl;
            
            // کپی خودکار در کلیپ‌بورد
            navigator.clipboard.writeText(currentUrl).catch(err => {
                console.error('خطا در کپی', err);
            });

            // شروع خودکار دانلود
            triggerDownload();
            
            showToast();
        }

        function triggerDownload() {
            if (!currentUrl) return;
            // ایجاد تگ موقت برای استارت دانلود
            let a = document.createElement('a');
            a.href = currentUrl;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        function change(ep_delta, se_delta) {
            episode += ep_delta;
            season += se_delta;
            
            if (season < 1) season = 1;
            if (episode < 1) {
                if (season > 1) {
                    season--;
                    episode = 1;
                } else {
                    episode = 1;
                }
            }
            update();
        }

        function showToast() {
            let t = document.getElementById('toast');
            t.style.display = 'block';
            setTimeout(() => {
                t.style.display = 'none';
            }, 1500);
        }

        update();
    </script>
</body>
</html>
